[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection"
version = "1.0.0"
description = "Fall detection from video with YOLO-pose, scene geometry and temporal classifiers (CO3057)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "opencv-python>=4.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "Pillow>=10",
    "scipy>=1.11",
    "ultralytics>=8.4.158,<9",
    "lap>=0.5.12",
    "onnx>=1.16",
    "onnxruntime>=1.19,<2",
    "imageio-ffmpeg>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
